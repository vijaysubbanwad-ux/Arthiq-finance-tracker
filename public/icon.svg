<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="arthiqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#02231c" />
    </linearGradient>

    <!-- Emerald Brand Gradient -->
    <linearGradient id="arthiqEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Teal-Cyan Secondary Gradient -->
    <linearGradient id="arthiqCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="arthiqGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.38" />
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="120" fill="url(#arthiqBg)" />

  <!-- Subtle Outer Rim Reflection -->
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="url(#arthiqEmerald)" stroke-width="3" stroke-opacity="0.25" />

  <!-- Ambient Light Pulse -->
  <circle cx="256" cy="240" r="160" fill="#10b981" opacity="0.07" />

  <!-- Central Monogram: The 'A' Financial Growth Crest -->
  <g filter="url(#emeraldGlow)">
    <!-- Left Ascending Pillar of 'A' (Sharp modern bevel angle) -->
    <path
      d="M 172 388 L 222 136 C 226 116 242 104 256 104 C 270 104 286 116 290 136 L 340 388 C 344 406 330 420 312 420 C 298 420 286 410 284 396 L 256 220 L 228 396 C 226 410 214 420 200 420 C 182 420 168 406 172 388 Z"
      fill="url(#arthiqEmerald)"
    />

    <!-- Modern Upward Growth Notch (Chevron in A's apex) -->
    <path
      d="M 256 142 L 276 248 L 236 248 Z"
      fill="#064e3b"
      opacity="0.9"
    />
  </g>

  <!-- Financial Crossbar: Dynamic Rising Momentum Arc & Trend Arrow -->
  <g filter="url(#goldGlow)">
    <!-- Glowing Crossbar Arc -->
    <path
      d="M 132 292 C 184 278 328 278 380 292"
      fill="none"
      stroke="url(#arthiqGold)"
      stroke-width="18"
      stroke-linecap="round"
    />

    <!-- Ascending Spark Token / Golden Coin Core at Apex -->
    <circle cx="380" cy="292" r="22" fill="url(#arthiqGold)" stroke="#ffffff" stroke-width="4" />
    <circle cx="380" cy="292" r="8" fill="#78350f" />

    <!-- North Star / Intelligence Spark above the 'A' -->
    <path
      d="M 256 56 Q 256 74 274 74 Q 256 74 256 92 Q 256 74 238 74 Q 256 74 256 56 Z"
      fill="url(#arthiqGold)"
    />
  </g>

  <!-- Rising Metric Nodes (3-Tier wealth growth dots) -->
  <circle cx="160" cy="350" r="7" fill="#34d399" opacity="0.8" />
  <circle cx="216" cy="316" r="8" fill="#34d399" opacity="0.9" />
  <circle cx="352" cy="350" r="7" fill="#34d399" opacity="0.8" />
</svg>
