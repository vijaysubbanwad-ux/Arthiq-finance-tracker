    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Arthiq",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "All",
      "description": "Smart wealth & expense intelligence. A modern personal finance companion with AI insights, real-time budgeting, and multi-currency tracking."
    }
    </script>
    <script>
      (function() {
        try {
          var profile = JSON.parse(localStorage.getItem('spendly_user_profile') || '{}');
          if (profile.darkMode === true || profile.theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
